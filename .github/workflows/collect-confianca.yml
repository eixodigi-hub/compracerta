name: Coleta Confiança Marília

on:
  schedule:
    # 07:30 America/Sao_Paulo (UTC-3, sem horário de verão no Brasil)
    - cron: "30 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: coleta-confianca
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/collectors/requirements.txt

      - name: Instalar navegador do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Restaurar totais conhecidos por categoria
        uses: actions/cache@v4
        with:
          path: .collector_state/confianca_category_totals.json
          key: confianca-totals-${{ github.run_id }}
          restore-keys: |
            confianca-totals-

      - name: Recriar sessão do navegador a partir do secret
        env:
          CONFIANCA_BROWSER_STATE_B64: ${{ secrets.CONFIANCA_BROWSER_STATE_B64 }}
        run: |
          mkdir -p .collector_state/confianca
          echo "$CONFIANCA_BROWSER_STATE_B64" | base64 --decode > .collector_state/confianca/browser_state.json

      - name: Rodar coleta Confiança
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          CONFIANCA_STORE_ID: ${{ secrets.CONFIANCA_STORE_ID }}
          CONFIANCA_BASE_URL: ${{ secrets.CONFIANCA_BASE_URL }}
          FINALIZE_CATEGORY_URL: ${{ secrets.FINALIZE_CATEGORY_URL }}
          CATEGORY_DELAY: "8"
        run: bash scripts/run_confianca_all.sh

      - name: Enviar logs como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-confianca-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
